name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      # The load-bearing behaviour cannot be tested in jsdom: the CSS Custom
      # Highlight API, caret hit-testing, and the guarantee that the page DOM is
      # never mutated. So this drives a real browser.
      #
      # xvfb because loading an unpacked extension is only reliable in headed
      # Chrome. Chrome is preinstalled on ubuntu-latest runners.
      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: test/e2e/fixture-shot.png
          if-no-files-found: ignore

      # Dataset integrity (count, duplicate numbers, stray YAML quotes, index
      # agreement) is already asserted by test/dataset.test.ts above.

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: eipeek-extension
          path: .output/*.zip
          if-no-files-found: error
          # .output is dot-prefixed, and upload-artifact treats hidden paths as
          # excluded by default.
          include-hidden-files: true
